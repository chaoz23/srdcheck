[build-system]
# project.license-files and the SPDX project.license expression need the PEP
# 639 support introduced in the setuptools 77 line, but releases before 83
# carry a Unicode-normalization manifest-exclusion vulnerability relevant to
# sdists. Version 83.0.0 is the first safe project floor and requires Python
# >=3.10.
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "srdcheck"
version = "0.9.0"
description = "Deterministic rules verdicts for game-running agents — cited, reproducible, honest about jurisdiction. SRD 5.2.1 is adapter #1."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
authors = [{name = "chaoz23"}]
keywords = ["srd", "ttrpg", "rules-engine", "ai-agents", "mcp", "verdicts"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Games/Entertainment :: Role-Playing",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

[project.urls]
Homepage = "https://github.com/chaoz23/srdcheck"

[project.scripts]
srdcheck = "srdcheck.cli:script"
srdcheck-mcp = "srdcheck.mcp:script"

[project.optional-dependencies]
dev = ["pytest", "pypdf"]

[tool.pytest.ini_options]
markers = [
    "slow: builds a wheel and installs it into a throwaway venv",
]

[tool.setuptools]
packages = ["srdcheck", "srdcheck.scaffold", "srdcheck.adapters"]

[tool.setuptools.package-data]
# *.txt carries the extracted CC-BY-4.0 SRD source text. It is REQUIRED at
# runtime: `srdcheck cite` reads sources/text/page-*.txt to return verbatim,
# page-numbered provenance. Omitting it silently degrades every cite call to
# cannot-adjudicate (the 0.5.0 release defect). Asserted by
# tests/test_packaging.py::test_wheel_contains_source_text.
srdcheck = [
    "capability_claims.json",
    "adapters/**/*.json",
    "adapters/**/*.py",
    "adapters/**/*.md",
    "adapters/**/sources/text/*.txt",
]
