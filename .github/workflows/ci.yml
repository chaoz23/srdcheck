name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Cheap, no-network gates. Runs first so a licensing or metadata violation
  # fails in seconds instead of after the SRD fetch.
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: No unlicensed third-party material, big binaries, or build artifacts
        run: python scripts/check_repo_hygiene.py
      - name: Fresh clone stays small
        run: |
          size=$(git count-objects -vH | awk '/size-pack/ {print $2$3}')
          echo "pack size: $size"
          bytes=$(git count-objects -v | awk '/size-pack/ {print $2}')
          # size-pack is reported in KiB; 20 MiB ceiling.
          test "$bytes" -lt 20480 || {
            echo "::error::pack exceeds 20 MiB — a large binary was committed"
            exit 1; }

  test:
    needs: hygiene
    # Ubuntu carries the full correctness/provenance suite on every supported
    # Python runtime. Windows and macOS have a separate public-artifact smoke
    # contract below; do not describe those representative lanes as full parity.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install pytest pypdf==6.14.2 build setuptools
      - name: Fetch SRD and extract text (provenance-verified)
        run: |
          bash srdcheck/adapters/srd-5.2.1/sources/fetch.sh
          bash srdcheck/adapters/srd-5.1/sources/fetch.sh
      - name: Committed SRD text matches extraction from the pinned PDFs
        # The extracted text is redistributed in the wheel (CC-BY-4.0) so that
        # `cite` works offline. Re-extracting and diffing proves the committed
        # copy is genuinely derived from the hash-pinned source, not asserted.
        shell: bash
        run: |
          cp -R srdcheck/adapters/srd-5.2.1/sources/text /tmp/committed-text-521
          python srdcheck/adapters/srd-5.2.1/sources/extract.py
          diff -r /tmp/committed-text-521 srdcheck/adapters/srd-5.2.1/sources/text
      - name: Rebuild 5.2.1 registry and verify it matches the committed one
        run: |
          cp srdcheck/adapters/srd-5.2.1/entities.json /tmp/committed-521.json
          python srdcheck/adapters/srd-5.2.1/build_entities.py
          diff /tmp/committed-521.json srdcheck/adapters/srd-5.2.1/entities.json
      - name: Rebuild the SRD 5.1 registry and verify it matches
        run: |
          cp srdcheck/adapters/srd-5.1/entities.json /tmp/committed-51.json
          python srdcheck/adapters/srd-5.1/build_entities.py
          diff /tmp/committed-51.json srdcheck/adapters/srd-5.1/entities.json
      - run: python -m pytest tests/ -q
      - name: Truth scorecard freshness (never hand-edited)
        run: python scripts/truth_scorecard.py --check
      - name: Golden verdicts unchanged (refactors must be invisible)
        run: python scripts/build_golden.py --check
      - name: All bundled adapters pass conformance
        run: |
          python -m srdcheck conformance srd-5.2.1
          python -m srdcheck conformance srd-5.1
          python -m srdcheck conformance toy-tictactoe

  # The minimum contract is Python 3.10, the declared setuptools floor, and no
  # runtime dependencies. Build without isolation so the floor is genuinely
  # exercised, then install the wheel with --no-deps/--no-index in the smoke.
  minimum-runtime:
    needs: hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - name: Install the minimum declared build backend
        run: python -m pip install "setuptools==83.0.0"
      - name: Build with the minimum dependency set
        run: >-
          python -m pip wheel . --no-deps --no-build-isolation
          --wheel-dir dist
      - name: Prove the zero-dependency runtime from a cold install
        run: python scripts/cold_artifact_smoke.py dist

  # Representative platform support contract. The smoke builds and installs
  # both distributions into paths containing spaces and Unicode, then uses the
  # installed CLI, library, citation data, and MCP stdio server. The full suite
  # remains Ubuntu-only by explicit policy.
  platform-smoke:
    needs: hygiene
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install build tooling
        run: python -m pip install build setuptools
      - name: Build wheel and source distribution
        run: python -m build --outdir dist
      - name: Exercise both artifacts through the platform smoke contract
        run: python scripts/cold_artifact_smoke.py dist

  # The gate 0.5.0 lacked: prove the *installed artifact* implements the
  # advertised behaviour, from a pristine tree, outside the repo, offline.
  cold-install:
    needs: hygiene
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install pytest build setuptools pypdf==6.14.2
      - name: Fetch SRD sources
        run: |
          bash srdcheck/adapters/srd-5.2.1/sources/fetch.sh
          bash srdcheck/adapters/srd-5.1/sources/fetch.sh
      - name: Build wheel and source distribution
        run: python -m build --outdir dist
      - name: Cold-install and exercise wheel and source distribution
        run: python scripts/cold_artifact_smoke.py dist
      - name: Packaging and metadata regression contracts
        run: python -m pytest tests/test_packaging.py tests/test_metadata_fresh.py -q
