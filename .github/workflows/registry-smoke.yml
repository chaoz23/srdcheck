name: registry-smoke

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Published srdcheck version or v-prefixed tag
        required: true
        type: string

permissions:
  contents: read

jobs:
  published-artifacts:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    runs-on: ubuntu-latest
    env:
      REGISTRY_VERSION: ${{ github.event.inputs.version || github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip setuptools
      - name: Download the exact published wheel and sdist
        shell: bash
        run: |
          VERSION="${REGISTRY_VERSION#v}"
          test -n "$VERSION"
          python -m pip download --no-deps --only-binary=:all: \
            --dest registry-artifacts "srdcheck==$VERSION"
          python -m pip download --no-deps --no-binary=:all: \
            --dest registry-artifacts "srdcheck==$VERSION"
      - name: Exercise published artifacts without registry access
        run: >-
          python scripts/cold_artifact_smoke.py
          registry-artifacts/*.whl registry-artifacts/*.tar.gz
